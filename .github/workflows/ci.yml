name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage", "| | % | covered |", "|---|---|---|", ...["statements","branches","functions","lines"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: npm run build

  # Workers Free only: `versions upload` and `deploy` create Worker versions on workers.dev; nothing billable.
  # Both jobs skip themselves when the CLOUDFLARE_API_TOKEN repository secret is missing (forks, setup not done yet).
  preview:
    name: Preview version (PR)
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the preview upload (see README.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci && npm run build
      - name: Upload preview version
        if: steps.token.outputs.present == 'true'
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          {
            echo "### Preview"
            grep -Eo 'https://[^ ]+workers\.dev' upload.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to workers.dev (main)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy (see README.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci && npm run build
      - name: Apply D1 migrations
        if: steps.token.outputs.present == 'true'
        run: npx wrangler d1 migrations apply fiets-vandaag --remote
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.token.outputs.present == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS https://fiets-vandaag.alessiogarifo92.workers.dev/api/health || true)
            echo "$body"
            case "$body" in *"+${GITHUB_SHA::7}\""*) exit 0 ;; esac
            sleep 10
          done
          echo "::error::/api/health did not report commit ${GITHUB_SHA::7}"
          exit 1
