# Temporary (ticket #2): checks that PDOK and Open-Meteo answer cross-origin browser requests. Removed before merge.
name: CORS probe
on:
  push:
    branches: [worktree-2-core-engine-today]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for m in knmi_seamless best_match; do
            echo "=== models=$m"
            curl -s "https://api.open-meteo.com/v1/forecast?latitude=52.37&longitude=4.89&hourly=precipitation_probability,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m&models=$m&timezone=Europe%2FAmsterdam&forecast_days=2" \
              | jq -c '{u:.hourly_units, pp:.hourly.precipitation_probability[6:12], p:.hourly.precipitation[6:12], ws:.hourly.wind_speed_10m[6:12], wd:.hourly.wind_direction_10m[6:12], nullpp:([.hourly.precipitation_probability[]|select(.==null)]|length)}'
          done
